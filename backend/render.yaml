# NOTA: o deploy atual roda via Docker numa VPS própria (ver Dockerfile e
# docker-compose fora deste repo) com Caddy na frente. Este manifesto reflete
# a mesma arquitetura (Postgres + MinIO) para o caso de precisar reativar um
# deploy no Render -- se o Render não estiver mais em uso como plataforma,
# este arquivo pode ser removido.
services:
  - type: web
    name: integracao-service
    runtime: docker
    region: ohio
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://www.ipessp.edu.br,https://ipessp.edu.br
