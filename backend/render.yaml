services:
  - type: web
    name: integracao-service
    runtime: node
    region: ohio
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: node dist/main
    healthCheckPath: /health
    disk:
      name: sqlite-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://www.ipessp.edu.br,https://ipessp.edu.br
      - key: DATABASE_PATH
        value: /opt/render/project/src/data/sync.db
      - key: SOPHIA_BASE_URL
        value: https://portal.sophia.com.br/SophiAWebAPI
      - key: SOPHIA_TENANT
        value: "10059"
      - key: SOPHIA_USUARIO
        value: INTEGRACAO
      - key: SOPHIA_SENHA
        sync: false
      - key: SYNC_CRON
        value: "0 * * * *"
      - key: SYNC_LOOKBACK_DAYS
        value: "30"
      - key: WEBHOOK_SECRET
        sync: false
      - key: SMTP_HOST
        value: smtp.office365.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        value: matricula.financeiro@ipessp.edu.br
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: "IPESSP <matricula.financeiro@ipessp.edu.br>"
      - key: ESCOLA_NOME
        value: IPESSP
      - key: ESCOLA_TELEFONE
        value: "(11) 99839-3640"
      - key: EMAIL_DIAS_ANTES
        value: "3"
      - key: EMAIL_DIAS_APOS
        value: "1,3,7"
      - key: EMAIL_DIAS_AVISO
        value: "10,9,8,7,6,4,3,2,1"
      - key: EMAIL_DIAS_RENEGOCIACAO_OVERLAP
        value: "1,3,7"
      - key: EMAIL_ASSETS_BASE_URL
        value: https://site-ipessp-frontend.vercel.app
      - key: EMAIL_CRON_HABILITADO
        value: "false"
      - key: EMAIL_LOGO_URL
        value: https://oylhowadealxvsmdhmzc.supabase.co/storage/v1/object/public/assets/logo.png
      - key: IA_BEARER_TOKEN
        sync: false
      - key: N8N_LEADS_WEBHOOK_URL
        sync: false
      - key: ESCOLA_EMAIL_NOTIFICACOES
        value: matricula.financeiro@ipessp.edu.br
      - key: SUPABASE_URL
        value: https://oylhowadealxvsmdhmzc.supabase.co
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: SITE_URL
        value: https://www.ipessp.edu.br
